name: Build macOS app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: UNIVERSAL=1 ./build.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent ClaudeUsageBar.app ClaudeUsageBar.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageBar
          path: build/ClaudeUsageBar.zip
